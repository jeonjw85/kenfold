# Local stack. Every port is published on 127.0.0.1 only, and the database
# credentials are for local use only.
#
#   make up          Postgres + Kenfold (full-text search)
#   make up-embed    + Ollama with bge-m3 for hybrid (full-text + vector) search,
#                    and a llama.cpp reranker (bge-reranker-v2-m3; RERANK=0 skips it)
#   make up-extract  + a local chat model for memory extraction and classification
name: kenfold

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: kenfold
      POSTGRES_PASSWORD: ${KENFOLD_DB_PASSWORD:-kenfold}
      POSTGRES_DB: kenfold
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h forces TCP so the check fails during the init-time temporary server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kenfold -d kenfold"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  kenfold:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        DATE: ${DATE:-unknown}
    image: kenfold:dev
    environment:
      KENFOLD_DATABASE_URL: postgres://kenfold:${KENFOLD_DB_PASSWORD:-kenfold}@postgres:5432/kenfold?sslmode=disable
      KENFOLD_AUTO_MIGRATE: "true"
      # Every /mcp request needs "Authorization: Bearer <key>"; create keys with `make key AGENT=...`.
      KENFOLD_AUTH: ${KENFOLD_AUTH:-apikey}
      # Embeddings are off unless KENFOLD_EMBED_URL is set. `make up-embed` points it at the
      # ollama service; for Ollama running natively on the host use http://host.docker.internal:11434/v1.
      KENFOLD_EMBED_URL: ${KENFOLD_EMBED_URL:-}
      KENFOLD_EMBED_MODEL: ${KENFOLD_EMBED_MODEL:-bge-m3}
      KENFOLD_EMBED_NAME: ${KENFOLD_EMBED_NAME:-}
      KENFOLD_EMBED_API_KEY: ${KENFOLD_EMBED_API_KEY:-}
      # Memory extraction and classification are off unless KENFOLD_CHAT_URL is set
      # (`make up-extract` points it at the ollama service).
      KENFOLD_CHAT_URL: ${KENFOLD_CHAT_URL:-}
      KENFOLD_CHAT_MODEL: ${KENFOLD_CHAT_MODEL:-qwen3.5:4b}
      KENFOLD_CHAT_API_KEY: ${KENFOLD_CHAT_API_KEY:-}
      KENFOLD_EXTRACT_POLICY: ${KENFOLD_EXTRACT_POLICY:-propose}
      # Reranking is off unless KENFOLD_RERANK_URL is set (`make up-embed` points it at the reranker service).
      KENFOLD_RERANK_URL: ${KENFOLD_RERANK_URL:-}
      KENFOLD_RERANK_MODEL: ${KENFOLD_RERANK_MODEL:-bge-reranker-v2-m3}
      KENFOLD_RERANK_API_KEY: ${KENFOLD_RERANK_API_KEY:-}
      KENFOLD_LOG_LEVEL: ${KENFOLD_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:7077:7077"
    extra_hosts:
      # Lets the container reach services on the host (e.g. native Ollama) on Linux too.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional local embedding server. Started only with the "embed" profile.
  ollama:
    image: ollama/ollama:0.34.4
    profiles: [embed]
    environment:
      # Keep the model loaded; reloading it after the default 5 minutes makes the next call slow.
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      # 11435 on the host so it does not collide with a native Ollama on 11434.
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  # Optional cross-encoder reranker (Ollama has no rerank API). Started only with
  # the "rerank" profile. The first start downloads the model (~640 MB).
  reranker:
    image: ghcr.io/ggml-org/llama.cpp:server-v0.5.0
    profiles: [rerank]
    command:
      - -hf
      - ${KENFOLD_RERANK_HF:-gpustack/bge-reranker-v2-m3-GGUF:Q8_0}
      - --alias
      - bge-reranker-v2-m3
      - --reranking
      - --embedding
      - --pooling
      - rank
      # One thread per performance core (see THREADS in the Makefile).
      - --threads
      - ${THREADS:-4}
      - --ctx-size
      - "8192"
      - --batch-size
      - "2048"
      - --ubatch-size
      - "2048"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "127.0.0.1:11436:8080"
    volumes:
      - reranker:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      # The first start downloads the model.
      retries: 360
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  reranker:
